<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">

<title>TG_@Cricmatchstream</title>

<script src="https://cdn.jsdelivr.net/npm/shaka-player@5.1.10/dist/shaka-player.ui.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@5.1.10/dist/controls.min.css">

<style>
*{box-sizing:border-box}

html,body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
}

.shaka-video-container{
    width:100%;
    height:100%;
    background:#000;
}

#videoPlayer{
    width:100%;
    height:100%;
    background:#000;
    object-fit:contain;
}

/* Telegram popup */
.telegram-overlay{
    position:fixed;
    inset:0;
    z-index:99999;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.82);
}

.telegram-overlay.show{
    display:flex;
}

.telegram-box{
    width:100%;
    max-width:350px;
    padding:28px 22px;
    text-align:center;
    color:#fff;
    background:#151515;
    border:1px solid #333;
    border-radius:18px;
    box-shadow:0 15px 45px rgba(0,0,0,.6);
    animation:popupIn .3s ease;
}

@keyframes popupIn{
    from{opacity:0;transform:translateY(15px)}
    to{opacity:1;transform:translateY(0)}
}

.telegram-icon{
    width:60px;
    height:60px;
    margin:0 auto 15px;
    border-radius:50%;
    background:#229ED9;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    font-weight:bold;
}

.telegram-box h2{
    margin:0 0 12px;
    font-size:22px;
}

.telegram-box p{
    margin:0 0 22px;
    color:#bbb;
    font-size:14px;
    line-height:1.6;
}

.telegram-join{
    display:block;
    width:100%;
    padding:13px;
    margin-bottom:12px;
    border:0;
    border-radius:9px;
    background:#229ED9;
    color:#fff;
    font-size:15px;
    font-weight:bold;
    text-decoration:none;
}

.telegram-close{
    width:100%;
    padding:12px;
    border:1px solid #444;
    border-radius:9px;
    background:#252525;
    color:#ddd;
    font-size:14px;
    cursor:pointer;
}

@media(max-width:600px){
    .telegram-box{max-width:330px;padding:25px 20px}
}
</style>
</head>

<body>

<div id="videoContainer" class="shaka-video-container">
    <video id="videoPlayer" playsinline autoplay muted></video>
</div>

<!-- Telegram popup -->
<div class="telegram-overlay" id="telegramPopup">
    <div class="telegram-box">
        <div class="telegram-icon">➤</div>
        <h2>Join Our Telegram</h2>
        <p>
            Join <strong>@cricmatchstream</strong>
            for updates and more links.
        </p>

        <a class="telegram-join"
           href="https://t.me/cricmatchstream"
           target="_blank"
           rel="noopener noreferrer">
            JOIN TELEGRAM
        </a>

        <button class="telegram-close" id="closePopup">
            Already Joined / Close
        </button>
    </div>
</div>

<script>
"use strict";

const STREAM_URL =
    "https://jiotvmblive.cdn.jio.com/bpk-tv/Ten_1_MOB/WDVLive/index.mpd";

const DRM_KEYS =
    "3394be91407c5fe99d784d2f2d6d4a12:58665e1df41f9f22ed73c56384bb3f51";

const COOKIE_JSON_URL =
    "https://sonujson-v4.pages.dev/Data/sports.json";

const CHANNEL_ID = "STEN1";

const videoElement = document.getElementById("videoPlayer");
const videoContainer = document.getElementById("videoContainer");

let player;
let ui;

/* Telegram popup */
document.addEventListener("DOMContentLoaded", () => {
    const popup = document.getElementById("telegramPopup");
    const closeButton = document.getElementById("closePopup");

    setTimeout(() => {
        popup.classList.add("show");
    }, 1200);

    closeButton.addEventListener("click", () => {
        popup.classList.remove("show");
    });
});

/* Parse DRM key pairs */
function parseDrmKeys(value) {
    const clearKeys = {};

    String(value || "")
        .split(",")
        .map(pair => pair.trim())
        .filter(Boolean)
        .forEach(pair => {
            const separator = pair.indexOf(":");

            if (separator === -1) return;

            const kid = pair.slice(0, separator).trim().toLowerCase();
            const key = pair.slice(separator + 1).trim().toLowerCase();

            if (kid && key) {
                clearKeys[kid] = key;
            }
        });

    return clearKeys;
}

/* Retrieve channel cookie */
async function getCookie() {
    const response = await fetch(COOKIE_JSON_URL, {
        method: "GET",
        cache: "no-store"
    });

    if (!response.ok) {
        throw new Error("Cookie JSON request failed: " + response.status);
    }

    const data = await response.json();

    if (!data || !Array.isArray(data.channels)) {
        throw new Error("Invalid JSON format.");
    }

    const channel = data.channels.find(item =>
        String(item.id || "").trim().toLowerCase() ===
        CHANNEL_ID.toLowerCase()
    );

    if (!channel || !channel.cookie) {
        throw new Error("Channel cookie not found: " + CHANNEL_ID);
    }

    return String(channel.cookie).trim();
}

/* Configure stream requests */
function configureStreamRequests(cookie) {
    if (!cookie) return;

    const networkingEngine = player.getNetworkingEngine();
    if (!networkingEngine) return;

    networkingEngine.registerRequestFilter((type, request) => {
        if (!request.uris || !request.uris[0]) return;

        request.headers = request.headers || {};
        request.headers["Cookie"] = cookie;

        const url = request.uris[0];

        if (
            (type === 0 || type === 1) &&
            !url.includes("__hdnea=") &&
            !url.includes("__hdnea__") &&
            !url.includes("hdnts=")
        ) {
            request.uris[0] =
                url +
                (url.includes("?") ? "&" : "?") +
                cookie;
        }
    });
}

/* Configure player */
function configureDrm() {
    player.configure({
        drm: {
            clearKeys: parseDrmKeys(DRM_KEYS)
        },
        manifest: {
            defaultPresentationDelay: 5
        },
        streaming: {
            lowLatencyMode: true,
            bufferingGoal: 10,
            rebufferingGoal: 2,
            safeSeekOffset: 5
        }
    });
}

/* Initialize Shaka Player */
async function initPlayer() {
    try {
        shaka.polyfill.installAll();

        if (!shaka.Player.isBrowserSupported()) {
            throw new Error("This browser does not support Shaka Player.");
        }

        player = new shaka.Player();
        await player.attach(videoElement);

        ui = new shaka.ui.Overlay(
            player,
            videoContainer,
            videoElement
        );

        ui.configure({
            controlPanelElements: [
                "play_pause",
                "time_and_duration",
                "mute",
                "volume",
                "spacer",
                "quality",
                "picture_in_picture",
                "fullscreen"
            ]
        });

        player.addEventListener("error", event => {
            console.error("Shaka Player Error:", event.detail);
        });

        const cookie = await getCookie();
        configureStreamRequests(cookie);
        configureDrm();

        await player.load(STREAM_URL);

        try {
            await videoElement.play();
        } catch (error) {
            console.log("Autoplay blocked; press Play to start.");
        }

    } catch (error) {
        console.error("Player initialization failed:", error);
    }
}

initPlayer();

window.addEventListener("beforeunload", () => {
    if (player) {
        player.destroy().catch(() => {});
    }
})
window.addEventListener("load", function () {
    setTimeout(function () {
        if (confirm("JOIN OUR TELEGRAM CHANNEL FOR MORE LIVE STREAM LINKS")) {
            window.location.href = "https://t.me/cricmatchstream";
        }
    }, 1000);
});
</script>

</body>
</html>
